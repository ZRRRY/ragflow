# -----------------------------------------------------------------------------
# Custom Docker Compose overrides for the RAGFlow dev branch.
#
# This file is automatically merged by Docker Compose when placed next to
# docker-compose.yml. It layers team-specific tuning on top of the official
# compose files without modifying them.
#
# Usage:
#   cd docker
#   COMPOSE_ENV_FILES=.env,.env.local docker compose -f docker-compose.yml up -d
# -----------------------------------------------------------------------------

services:
  opensearch01:
    environment:
      # Constrain OpenSearch JVM heap for single-node dev deployments.
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g

  ragflow-cpu:
    # Ensure custom env overrides from .env.local are visible inside the
    # container alongside the official docker/.env values.
    env_file:
      - .env.local
    volumes:
      # Dev hot-reload mounts: reflect local source changes without rebuilding
      # the Docker image.
      - ../rag:/ragflow/rag
      - ../api:/ragflow/api
      - ../web/dist:/ragflow/web/dist
      - ../tools/scripts:/ragflow/tools/scripts
      - ../common:/ragflow/common
      - ../deepdoc:/ragflow/deepdoc

  ragflow-gpu:
    env_file:
      - .env.local
